# Alerts (plan §19, Phase 6): email to ALERT_EMAIL. Grafana sends mail only when SMTP is configured
# (GF_SMTP_* in the compose file); without it the alerts still show as firing in Grafana.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: cb-email
        type: email
        settings:
          addresses: ${ALERT_EMAIL}
          singleEmail: true

policies:
  - orgId: 1
    receiver: email
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: code-battle
    folder: Code Battle
    interval: 1m
    rules:
      - uid: cb-judge-breaker-open
        title: Judge0 breaker open
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: Judge0 keeps failing; new matches are refused and running ones may go to deciding.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'max(judge0_breaker_open)', instant: true }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [1.5] } }]

      - uid: cb-judge-budget-low
        title: Judge0 budget low
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: Fewer than 100 Judge0 calls left today; below the match reserve new matches stop.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'min(judge0_budget_remaining)', instant: true }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [100] } }]

      - uid: cb-consumer-lag
        title: Kafka consumer falling behind
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: A consumer group is more than 100 messages behind for 5 minutes (results and pushes are late).
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'max(kafka_consumer_lag)', instant: true }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [100] } }]

      - uid: cb-outbox-stuck
        title: Outbox not draining
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: More than 100 events waiting to be published for 5 minutes (is Redpanda down?).
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'max(outbox_unpublished)', instant: true }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [100] } }]

      - uid: cb-dead-letters
        title: New dead letters
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: A message or job failed every retry and was parked in dead_letters; inspect and replay.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'sum(delta(dead_letters[15m]))', instant: true }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      - uid: cb-http-5xx
        title: Server errors
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: More than 5% of requests to a service failed with 5xx for 5 minutes.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                max(sum by (service) (rate(http_server_duration_seconds_count{status_code=~"5.."}[5m]))
                / sum by (service) (rate(http_server_duration_seconds_count[5m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0.05] } }]
