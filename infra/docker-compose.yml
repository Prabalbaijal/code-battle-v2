# Local development infrastructure (plan §7, §23). Start: `pnpm infra:up`.
# Images are pinned; keep packages/libs/testing/src/index.ts IMAGES in sync.
name: code-battle

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_USER: cb
      POSTGRES_PASSWORD: cb
      POSTGRES_DB: cb
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cb']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # noeviction is required by BullMQ; every cache key must have a TTL (plan §18.1).
    command:
      [
        'redis-server',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'noeviction',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
      ]
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --default-log-level=warn
    ports: ['19092:19092', '9644:9644']
    volumes: [redpandadata:/var/lib/redpanda/data]
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      retries: 30

  redpanda-console:
    image: redpandadata/console:v3.14.0
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ['8081:8080'] # 8080 is the gateway
    depends_on:
      redpanda: { condition: service_healthy }

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - '16686:16686' # UI
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP (services use OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318)

  fake-judge0:
    build:
      context: ..
      dockerfile: infra/docker/node-app.Dockerfile
      args:
        APP: '@cb/fake-judge0'
    environment:
      PORT: '2358'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports: ['2358:2358']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:2358/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  redpandadata:
