name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-deps
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test

  integration:
    name: Integration tests (Testcontainers)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pre-pull container images
        run: |
          docker pull pgvector/pgvector:0.8.7-pg16-trixie &
          docker pull redis:7-alpine &
          docker pull redpandadata/redpanda:v26.2.6 &
          wait
      - run: pnpm test:int

  docker:
    name: Docker image builds
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build fake-judge0 and template-service images
        run: |
          for app in @cb/fake-judge0 @cb/template-service; do
            docker buildx build -f infra/docker/node-app.Dockerfile --build-arg APP=$app --load -t "cb/${app#@cb/}:ci" .
          done
