name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-deps
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      # the UI kit's stories must keep compiling (plan §21.5)
      - run: pnpm --filter @cb/ui build-storybook
      # plan §21.4: First Load JS per route, measured from the real HTML of a production build
      - name: Web bundle budgets
        run: |
          pnpm --filter @cb/web start > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
          pnpm --filter @cb/web budgets

  integration:
    name: Integration tests (Testcontainers)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pre-pull container images
        run: |
          docker pull pgvector/pgvector:0.8.7-pg16-trixie &
          docker pull redis:7-alpine &
          docker pull redpandadata/redpanda:v26.2.6 &
          wait
      - run: pnpm test:int

  docker:
    name: Docker image builds
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build service images
        run: |
          for app in @cb/fake-judge0 @cb/template-service @cb/identity-service @cb/notification-service @cb/user-service @cb/gateway @cb/problem-service @cb/judge-service @cb/battle-service @cb/rating-service @cb/realtime-service; do
            docker buildx build -f infra/docker/node-app.Dockerfile --build-arg APP=$app --load -t "cb/${app#@cb/}:ci" .
          done
